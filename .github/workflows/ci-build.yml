name: CI Build Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/Casko.Text.slnx

      - name: Build
        run: dotnet build src/Casko.Text.slnx --configuration Release --no-restore
